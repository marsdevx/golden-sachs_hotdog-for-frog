[project]
name = "ai-firewall"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
# injection_classifier's onnx backend; tests pass without it
ml = [
  "huggingface_hub>=0.23,<2",
  "onnxruntime>=1.18,<2",
  "tokenizers>=0.19,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firewall_app"]
