<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1132 572" width="1132" height="572" role="img" aria-label="Sequence of one demo chat turn: the chat agent sends the conversation to the firewall proxy, which runs the input Check, forwards to the LLM, runs the output Check on the reply and returns it. A proposed tool call goes to the tool gateway, which runs the tool_call Check, executes the file tool, runs the tool_result Check and returns the cleaned result. The loop repeats up to 8 model and 8 tool calls within 120 seconds.">
<title>Sequence of one demo chat turn: the chat agent sends the conversation to the firewall proxy, which runs the input Check, forwards to the LLM, runs the output Check on the reply and returns it. A proposed tool call goes to the tool gateway, which runs the tool_call Check, executes the file tool, runs the tool_result Check and returns the cleaned result. The loop repeats up to 8 model and 8 tool calls within 120 seconds.</title>
<style>
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --surface-2: #E9EEF4; --ink: #17202B; --muted: #586474; --line: #C4CEDB;
  --accent: #1E5BD0; --accent-ink: #FFFFFF; --fw-fill: #EEF3FC;
  --block: #C2313A; --block-soft: #FBE5E6; --redact: #A86A12; --redact-soft: #FBEFD9;
  --allow: #2C8251; --sem: #7445C4; --sem-soft: #F0E9FB;
  
  
  
 --body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root {
  --bg: #0E131A; --surface: #161D27; --surface-2: #1D2633; --ink: #E5EAF1; --muted: #98A4B4; --line: #354256;
  --accent: #6F9BFF; --accent-ink: #0B1220; --fw-fill: #142036;
  --block: #F07A82; --block-soft: #3A1D22; --redact: #E2A84E; --redact-soft: #382B15;
  --allow: #62C48E; --sem: #B699F2; --sem-soft: #271F3C;   } }
text { font-family: var(--body); fill: var(--ink); }
.bg { fill: var(--surface); }
.t { font-size: 13px; font-weight: 600; }
.s { font-size: 11px; fill: var(--muted); }
.m { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.lbl { font-size: 10.5px; fill: var(--muted); }
.lm { font-family: var(--mono); }
.cap { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; fill: var(--muted); }
.fw-label { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; fill: var(--accent); font-weight: 500; }
.note-b { font-size: 10.5px; fill: var(--block); }
.note-r { font-size: 10.5px; fill: var(--redact); }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.ext { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; }
.cfg { fill: var(--surface); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 5 3; }
.fw { fill: var(--fw-fill); stroke: var(--accent); stroke-width: 2; }
.strong { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
.band { fill: var(--surface-2); stroke: none; }
.band-sem { fill: var(--sem-soft); stroke: var(--sem); stroke-width: 1; }
.sem-t { fill: var(--sem); }
.badge { fill: var(--accent); }
.badge-t { fill: var(--accent-ink); font-family: var(--mono); font-size: 11px; font-weight: 500; }
.blk { fill: var(--block-soft); stroke: var(--block); stroke-width: 1.4; }
.red { fill: var(--redact-soft); stroke: var(--redact); stroke-width: 1.4; }
.ln { stroke: var(--ink); stroke-width: 1.3; fill: none; }
.ln-d { stroke: var(--muted); stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
.ln-a { stroke: var(--accent); stroke-width: 1.3; fill: none; }
.life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.life-a { stroke: var(--accent); stroke-width: 2; }
.frag { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }
.mk { fill: var(--ink); }
.mk-m { fill: var(--muted); }
.mk-a { fill: var(--accent); }
</style>
<rect class="bg" x="-16" y="-16" width="1132" height="572" rx="10"/>

          <defs>
            <marker id="f3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
          </defs>
          <!-- Lane headers -->
          <rect x="15" y="16" width="130" height="40" rx="8" class="ext"/>
          <text x="80" y="41" text-anchor="middle" class="t">User</text>
          <rect x="215" y="16" width="150" height="40" rx="8" class="ext"/>
          <text x="290" y="41" text-anchor="middle" class="t">Demo chat agent</text>
          <rect x="485" y="16" width="150" height="40" rx="8" class="strong"/>
          <text x="560" y="41" text-anchor="middle" class="t">Firewall</text>
          <rect x="755" y="16" width="150" height="40" rx="8" class="ext"/>
          <text x="830" y="41" text-anchor="middle" class="t">LLM upstream</text>
          <rect x="945" y="16" width="130" height="40" rx="8" class="ext"/>
          <text x="1010" y="41" text-anchor="middle" class="t">File tool</text>

          <!-- Lifelines -->
          <line x1="80" y1="56" x2="80" y2="525" class="life"/>
          <line x1="290" y1="56" x2="290" y2="525" class="life"/>
          <line x1="560" y1="56" x2="560" y2="525" class="life-a"/>
          <line x1="830" y1="56" x2="830" y2="525" class="life"/>
          <line x1="1010" y1="56" x2="1010" y2="525" class="life"/>

          <!-- Loop fragment -->
          <rect x="180" y="112" width="910" height="364" rx="6" class="frag"/>
          <text x="302" y="468" class="cap">LOOP · ≤ 8 + 8 CALLS · 120 S</text>

          <!-- 1 -->
          <line x1="80" y1="96" x2="287" y2="96" class="ln" marker-end="url(#f3-a)"/>
          <text x="184" y="89" text-anchor="middle" class="lbl">question</text>
          <!-- 2 input -->
          <line x1="290" y1="140" x2="487" y2="140" class="ln" marker-end="url(#f3-a)"/>
          <text x="394" y="133" text-anchor="middle" class="lbl lm">POST /v1/chat/completions</text>
          <rect x="490" y="128" width="140" height="24" rx="12" class="badge"/>
          <text x="560" y="144" text-anchor="middle" class="badge-t">input Check</text>
          <text x="638" y="160" class="note-b">block → model never called</text>
          <!-- 3 forward -->
          <line x1="560" y1="184" x2="827" y2="184" class="ln" marker-end="url(#f3-a)"/>
          <text x="695" y="177" text-anchor="middle" class="lbl">allowed: forward</text>
          <!-- 4 output -->
          <line x1="830" y1="228" x2="633" y2="228" class="ln" marker-end="url(#f3-a)"/>
          <text x="726" y="221" text-anchor="middle" class="lbl">reply, tool_calls, usage</text>
          <rect x="490" y="216" width="140" height="24" rx="12" class="badge"/>
          <text x="560" y="232" text-anchor="middle" class="badge-t">output Check</text>
          <text x="638" y="248" class="note-r">PII redacted, exfil links removed</text>
          <!-- 5 -->
          <line x1="490" y1="272" x2="293" y2="272" class="ln" marker-end="url(#f3-a)"/>
          <text x="396" y="265" text-anchor="middle" class="lbl">checked reply</text>
          <!-- 6 tool_call -->
          <line x1="290" y1="316" x2="487" y2="316" class="ln" marker-end="url(#f3-a)"/>
          <text x="394" y="309" text-anchor="middle" class="lbl lm">POST /v1/tools/execute</text>
          <rect x="490" y="304" width="140" height="24" rx="12" class="badge"/>
          <text x="560" y="320" text-anchor="middle" class="badge-t">tool_call Check</text>
          <text x="638" y="336" class="note-b">folder denied → tool never runs</text>
          <!-- 7 execute -->
          <line x1="560" y1="360" x2="1007" y2="360" class="ln" marker-end="url(#f3-a)"/>
          <text x="785" y="353" text-anchor="middle" class="lbl">allowed: execute</text>
          <!-- 8 tool_result -->
          <line x1="1010" y1="404" x2="633" y2="404" class="ln" marker-end="url(#f3-a)"/>
          <text x="816" y="397" text-anchor="middle" class="lbl">file content</text>
          <rect x="490" y="392" width="140" height="24" rx="12" class="badge"/>
          <text x="560" y="408" text-anchor="middle" class="badge-t">tool_result Check</text>
          <text x="638" y="424" class="note-r">injection sentence or PII removed</text>
          <!-- 9 -->
          <line x1="490" y1="448" x2="293" y2="448" class="ln" marker-end="url(#f3-a)"/>
          <text x="396" y="441" text-anchor="middle" class="lbl">cleaned result → next model call</text>
          <!-- 10 -->
          <line x1="290" y1="508" x2="83" y2="508" class="ln" marker-end="url(#f3-a)"/>
          <text x="184" y="501" text-anchor="middle" class="lbl">answer + run_id</text>
        
</svg>
