# AI Control Layer Policy: the single source of truth for the firewall.
# Reloaded on save, no restart. An invalid file keeps the last good Policy
# (error in the console). Settings marked "not implemented" load and are ignored.
#
# Modes: off | monitor (record only) | redact (rewrite, let through) | block

version_note: "policy.yaml"

# permissive | standard | strict: a file in presets/ laid over `controls:` below.
# custom: the Controls exactly as written here.
preset: permissive

defaults:
  unknown_agent: block             # request without a known agent key: block | allow
  on_error: block                  # a Control crashes: block | allow

agents:
  - key: "demo-agent-key"          # X-Agent-Key header or Bearer token
    id: "research-assistant"
    owner: "alice@bank.example"
    team: "markets-research"
    enabled: true                  # not implemented
    require_user: true             # not implemented
  - key: "trading-agent-key"
    id: "trading-assistant"
    owner: "bob@bank.example"
    team: "trading-desk"
    enabled: true
    require_user: true

upstreams:
  - models: ["qwen3:4b", "qwen3:1.7b"]
    provider: ollama
    base_url: "http://localhost:11434/v1"
    base_url_env: OLLAMA_API_BASE
    api_key_env: null              # name of an env var, never the key itself
  - models: ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-4-5"]
    provider: anthropic
    base_url: "https://api.anthropic.com/v1"
    api_key_env: ANTHROPIC_API_KEY
  - models: ["mock"]
    provider: mock
    base_url: "mock://"

allowed_models: ["qwen3:4b", "qwen3:1.7b", "claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-4-5", "mock"]

# Master switches: false = as if the feature did not exist.
features:
  input_validation: true           # keyword_blocklist, injection_heuristics, injection_classifier
  data_protection: true            # sensitive_data, output_sanitizer
  resource_access: true            # resource_access
  usage_limits: true               # loop_detector, request_limits, token_budget
  attack_mitigation: true          # attack_signatures
  audit: true                      # false: no Audit Events
  console: true                    # false: /console returns 404

audit:
  store_content: redacted          # full | redacted | none
  retention_days: 180              # not implemented

observability:                     # not implemented
  semconv: openinference

# Controls run top to bottom; the first block stops the rest.
controls:

  loop_detector:
    mode: block
    description: "Stops runaway Agents that repeat themselves or call too often."
    params:
      window_seconds: 60
      max_similar: 3               # the 4th identical call in the window is blocked
      ignore_numbers: true
      max_calls: 30
      breaker_cooldown_seconds: 300  # a looping Agent is stopped this long (0 = off)

  request_limits:
    mode: block
    description: "Caps the size of every single request, reply and Resource call."
    params:
      max_messages: 100
      max_prompt_tokens: 8000
      max_completion_tokens: 2048
      require_max_tokens: false
      max_tool_args_tokens: 4000
      max_tool_result_tokens: 8000

  token_budget:
    mode: block
    description: "Stops an Agent, user or run that has used up its token budget."
    params:
      default:                     # per Agent, per UTC day
        tokens_per_day: 200000
        warn_at: 0.8
      per_user:                    # per user, per UTC day
        tokens_per_day: 50000
        warn_at: 0.8
      per_run:                     # one conversation or task
        requests: 25
        tool_calls: 40
        tokens: 300000
        wall_clock_seconds: 300
        idle_seconds: 600
        warn_at: 0.8

  keyword_blocklist:
    mode: block
    stages: [input, output]
    description: "Blocks messages containing forbidden phrases (e.g. confidential deal code names)."
    params:
      keywords: ["project falcon"]

  # Known attacks from an external signature feed (hot reloaded).
  attack_signatures:
    mode: block
    stages: [input, tool_call, tool_result]
    on_error: block                # no usable feed: fail closed
    description: "Blocks payloads matching known historical attacks on AI systems, from an externally managed signature feed (OWASP Agentic Top 10)."
    params:
      feed: policies/signatures.yaml   # path relative to this file, or https:// URL
      refresh_seconds: 60
      disabled: []                     # signature ids to switch off
      skip_args: []
      signatures: []

  # A new kind of sensitive data is a new category here, e.g.:
  #   - {name: pesel, patterns: ['\b\d{11}\b'], validator: pesel_checksum}
  sensitive_data:
    mode: redact
    stages: [output, tool_result]
    description: "Removes Sensitive Data (personal data, payment data, secrets) using the categories below. Add a category here to cover a new regulation."
    params:
      level: personal               # slider: personal < financial < secrets
      categories:
        - name: email
          group: personal
          description: "Email addresses, including obfuscated forms like name [at] bank [dot] com"
          patterns:
            - '[\w.+-]{1,64}@[\w-]+(?:\.[\w-]+)+'
            - '(?i)[\w.+-]{1,64}\s*[\[(]at[\])]\s*[\w-]+(?:\s*[\[(]dot[\])]\s*[\w-]+)+'
        - name: phone
          group: personal
          description: "International phone numbers (+48 600 123 456)"
          patterns: ['(?<![\w+])\+\d{1,3}[ -]?\d{2,4}(?:[ -]?\d{2,4}){2,3}(?!\w)']
        - name: card
          group: financial
          description: "Payment card numbers (Luhn-checked)"
          patterns: ['\b(?:\d[ -]?){12,18}\d\b']
          validator: luhn
        - name: iban
          group: financial
          description: "Bank account numbers in IBAN format (checksum-checked)"
          patterns: ['\b[A-Z]{2}\d{2}(?: ?[A-Z0-9]){11,30}\b']
          validator: iban
        - name: aws_access_key
          group: secrets
          description: "AWS access key ids"
          patterns: ['\b(?:AKIA|ASIA)[0-9A-Z]{16}\b']
          on_match: block
        - name: github_token
          group: secrets
          description: "GitHub tokens"
          patterns: ['\bgh[pousr]_[A-Za-z0-9]{36,}\b']
          on_match: block
        - name: llm_api_key
          group: secrets
          description: "OpenAI / Anthropic style API keys"
          patterns: ['\bsk-(?:ant-)?[A-Za-z0-9_-]{20,}']
          on_match: block
        - name: private_key
          group: secrets
          description: "PEM private keys"
          patterns: ['-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]+?-----END [A-Z ]*PRIVATE KEY-----']
          on_match: block
        - name: jwt
          group: secrets
          description: "JSON Web Tokens"
          patterns: ['\beyJ[\w-]{10,}\.[\w-]{10,}\.[\w-]{10,}']
          on_match: block
        - name: generic_secret
          group: secrets
          description: "Long random strings next to words like key, token, password"
          patterns: ['[A-Za-z0-9+/_-]{32,}={0,2}']
          validator: entropy
          context: [key, token, secret, password, bearer, credential]
          on_match: block
        - name: mna_client         # no group: on at every level
          description: "Clients of live M&A deals: never sent to the model"
          keywords: ["Nordbank AG"]

  pii_filter:                      # not implemented (the slider is sensitive_data.level)
    mode: redact
    stages: [output, tool_result]
    description: "Removes personal and financial data from what the AI returns."
    params:
      level: pii_financial
      extra_categories: [salary, health]

  injection_heuristics:
    mode: block
    stages: [input, tool_result]
    description: "Blocks known prompt-injection phrasing (English, Polish, German), also when hidden with encoding or look-alike letters; removes it from documents."
    params:
      on_indirect: redact          # injection inside a document: redact (remove the sentence) | block
      languages: [en, pl, de]
      decode: [base64, hex, url, rot13]
      extra_patterns: []

  # Default deny. The deepest listed folder decides; same folder twice: the strictest wins.
  resource_access:
    mode: block
    stages: [tool_call]
    description: "The AI may only read or write files in the folders you allow here."
    params:
      resources: [files]
      action_classes:              # unlisted actions count as write
        read_file: read
        list_dir: read
        list_files: read
        write_file: write
        delete_file: write
      path_args: [path, paths, src, dst]
      base_dir: /home/me
      default: none                # outside every folder: none | read | write
      folders:
        - {path: /demo, access: read, description: "The demo chat's files"}
        - {path: /demo/private, access: none, description: "Demo denied folder"}
        - {path: /demo/sandbox, access: write, description: "Demo folder the AI may delete files in"}
        # Trader's PC: own desk readable, M&A never. On the banker's PC swap the two.
        - {path: /demo/trading, access: read, description: "My desk's files"}
        - {path: /demo/mna, access: none, description: "Information barrier: live M&A deals"}
        - {path: /home/me/Projects, access: write}
        - {path: /home/me/Documents, access: read}
        - {path: /home/me/Documents/Private, access: none}
        - {path: /home/me/.ssh, access: none, description: "Keys: never"}

  injection_classifier:
    mode: block
    stages: [input, tool_result]
    on_error: allow                # model unavailable: allow | block
    description: "A local AI model checks whether text tries to hijack the AI, catching reworded attacks the fixed patterns miss; removes it from documents."
    params:
      backend: onnx
      model: "protectai/deberta-v3-base-prompt-injection-v2"
      model_dir: null
      threshold: 0.9               # score 0..1 that counts as injection
      on_indirect: redact
      window_tokens: 512
      window_overlap: 64

  output_sanitizer:
    mode: redact
    stages: [output]
    description: "Removes links, images and scripts in AI replies that could send data outside the bank (e.g. an image URL carrying client data). Only the domains listed below are kept."
    params:
      allowed_domains: ["*.bank.internal", "bank.internal"]
      images: true
      links: true
      html: true
      scripts: true
