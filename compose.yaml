services:
  phoenix:
    networks: [default, upstream]
    image: arizephoenix/phoenix:latest
    profiles: [observability]
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data

  postgres:
    networks: [storage]
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firewall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firewall}
      POSTGRES_DB: ${POSTGRES_DB:-firewall}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  firewall:
    networks: [control, upstream, storage]
    build: ./firewall
    environment: &firewall-env
      FIREWALL_SETTINGS_ENABLED: "false"
      POLICY_PATH: /config/policy.yaml
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-firewall}:${POSTGRES_PASSWORD:-firewall}@postgres:5432/${POSTGRES_DB:-firewall}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434/v1}
      TELEMETRY_OTLP_ENDPOINT: ${TELEMETRY_OTLP_ENDPOINT:-}
      TELEMETRY_PROJECT: ${TELEMETRY_PROJECT:-ai-control-layer}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-60}
      OLLAMA_TOOL_REASONING_EFFORT: ${OLLAMA_TOOL_REASONING_EFFORT:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./policy.yaml:/config/policy.yaml:ro
      - ./presets:/config/presets:ro      # `preset:` in policy.yaml; a folder, so edits always show
      # The externally managed attack-signature feed, next to the Policy so the relative
      # `feed: policies/signatures.yaml` resolves. Hot reloaded from the host on save.
      - ./policies/signatures.yaml:/config/policies/signatures.yaml:ro
      - ./firewall/firewall_app/demo_data:/service/firewall_app/demo_data
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The user's console has policy write access; agents cannot reach its network.
  firewall-console:
    networks: [default, storage]
    build: ./firewall
    ports:
      - "127.0.0.1:${FIREWALL_PORT:-8001}:8001"
    environment:
      <<: *firewall-env
      FIREWALL_SETTINGS_ENABLED: "true"
    volumes:
      - ./policy.yaml:/config/policy.yaml
      - ./presets:/config/presets:ro
      - ./firewall/firewall_app/demo_data:/service/firewall_app/demo_data
      - ./policies/signatures.yaml:/config/policies/signatures.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      firewall:
        condition: service_healthy

  chat:
    networks: [control]
    build: ./chat
    environment:
      LLM_MODEL: ${LLM_MODEL:-mock}
      FIREWALL_URL: http://firewall:8001
      FIREWALL_TIMEOUT_SECONDS: ${FIREWALL_TIMEOUT_SECONDS:-130}
      AGENT_KEY: ${AGENT_KEY:-demo-agent-key}
    depends_on:
      firewall:
        condition: service_healthy

  chat-ingress:
    image: nginx:stable-alpine
    networks: [default, control]
    ports:
      - "127.0.0.1:${CHAT_PORT:-8000}:8000"
    volumes:
      - ./deploy/chat-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chat

volumes:
  phoenix-data:
  pgdata:

networks:
  default: {}
  upstream: {}
  storage:
    internal: true
  control:
    internal: true
